<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPMKRT - Tablón de Presencia</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>UPMKRT</h1>
      <p class="subtitle">Estado en tiempo real del taller</p>
    </header>

    <main>
      <div class="card">
        <div class="list-header">
          <h3>En el taller ahora</h3>
          <span id="contadorPresentes" class="badge">0 personas</span>
        </div>
        <ul id="listaPresentes" class="member-list">
          <li class="member-empty">Cargando estado...</li>
        </ul>
      </div>

      <div class="card info-box">
        <p>ℹ️ <strong>¿Quieres fichar?</strong> Acerca tu móvil a la pegatina NFC situada en la puerta del taller.</p>
      </div>
    </main>
  </div>

  <script src="tablon.js"></script>
</body>
</html>
